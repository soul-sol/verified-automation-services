name: Technical kit purchase interest
description: Ask about a ready-to-download technical kit.
title: "[Kit interest] "
labels:
  - inquiry
  - digital-kit
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Spreadsheet Integrity Audit Kit — USD 9
        - GitHub Actions CI Triage Kit — USD 19
        - Open Source Bounty Monitor Kit — USD 19
        - Go/Linux Cross-Architecture CI Starter Kit — USD 29
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Intended platform
      options:
        - macOS
        - Linux
        - Windows
        - GitHub Actions
        - Not sure
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Compatibility question
      description: Do not include files, credentials, or private repository details.
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Purchase-interest acknowledgement
      options:
        - label: I understand this public issue is not an order or payment and compatibility will be confirmed first.
          required: true
