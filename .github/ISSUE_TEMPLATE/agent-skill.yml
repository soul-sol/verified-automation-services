name: AI agent skill and evaluation harness
description: Request a reusable agent skill with explicit tests and boundaries.
title: "[Agent skill] "
labels:
  - inquiry
  - agent-skill
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Basic — KRW 99,000
        - Standard — KRW 299,000
        - Custom — quote required
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      description: Describe the repeatable result the agent must produce.
    validations:
      required: true
  - type: textarea
    id: inputs_outputs
    attributes:
      label: Example inputs and expected outputs
      description: Use synthetic or public examples only.
    validations:
      required: true
  - type: textarea
    id: failures
    attributes:
      label: Important failures and forbidden actions
      description: Include cases the skill must reject or escalate.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Target runtime or agent
      placeholder: "Example: Codex, Claude Code, custom MCP client"
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue confirmation
      options:
        - label: All examples are synthetic or public and contain no credentials or private business data.
          required: true

